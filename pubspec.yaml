name: faculty_app
description: "CHRIST University Faculty App foundation setup."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.1
  dio: ^5.4.1
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  supabase_flutter: ^2.6.0
  google_sign_in: ^6.2.1
  table_calendar: ^3.1.2
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  url_launcher: ^6.2.5
  sentry_flutter: ^9.0.0
  haptic_feedback: ^0.6.4+3
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
